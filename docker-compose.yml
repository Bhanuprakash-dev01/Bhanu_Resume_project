version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delivery-support-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy-key}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      POSTGRES_DB: ${POSTGRES_DB:-delivery_support}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      CHROMA_HOST: chroma
    depends_on:
      - postgres
      - redis
      - chroma
    volumes:
      - .:/app

  postgres:
    image: postgres:16
    container_name: delivery-support-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery_support}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: delivery-support-redis
    ports:
      - "6379:6379"

  chroma:
    image: chromadb/chroma:latest
    container_name: delivery-support-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  postgres_data:
  chroma_data:
